name: ${COMPOSE_PROJECT_NAME:-beanmap}

services:
  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:?set LEGAL_OPERATOR_NAME}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:?set LEGAL_CONTACT_EMAIL}
      SUPABASE_SERVER_URL: ${SUPABASE_SERVER_URL:?set SUPABASE_SERVER_URL}
      GO_API_URL: http://api:8080
      NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:-beanmap}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?set NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/ko/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1001,gid=1001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - beanmap

  api:
    image: ${API_IMAGE:?set API_IMAGE}
    environment:
      PORT: "8080"
      DATABASE_URL_FILE: /run/secrets/api_database_url
      JWKS_URL: ${JWKS_URL:?set JWKS_URL}
      JWT_ISSUER: ${JWT_ISSUER:?set JWT_ISSUER}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    secrets:
      - api_database_url
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=1001,gid=1001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - beanmap

networks:
  beanmap:

secrets:
  api_database_url:
    file: ./secrets/api_database_url
