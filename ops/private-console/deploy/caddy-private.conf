[Unit]
Requires=beanmap-private-transport.service
After=beanmap-private-transport.service

[Service]
EnvironmentFile=/etc/beanmap-private-console/caddy.env
# The distribution unit uses --environ, which would print these credentials.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile

# Created as the unprivileged Caddy user inside its existing writable /run/caddy.
ExecStartPre=/usr/bin/install -d -m 0700 /run/caddy/private
UMask=0077
