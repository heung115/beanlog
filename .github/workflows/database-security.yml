name: Database security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  function-acls:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check migrated function ACLs and rejection probes
        env:
          ACL_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/postgres
        run: bash scripts/test-function-acls.sh
