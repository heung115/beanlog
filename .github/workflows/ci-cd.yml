name: beanmap CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beanmap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.18.0"
  GO_VERSION: "1.26.5"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    env:
      # Production build validation does not need real credentials. Runtime
      # credentials stay in the deployment environment.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: production
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for variable in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!variable:-}" ]; then
              echo "Deployment secret ${variable} is required when DEPLOY_ENABLED=true." >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/beanmap_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/beanmap_deploy" "$HOME/.ssh/known_hosts"

      - name: Package the verified source
        shell: bash
        run: git archive --format=tar.gz --output="beanmap-${GITHUB_SHA}.tar.gz" HEAD

      - name: Upload source and rebuild the deployed services
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SOURCE_PATH: ${{ secrets.DEPLOY_SOURCE_PATH }}
          DEPLOY_COMPOSE_PATH: ${{ secrets.DEPLOY_COMPOSE_PATH }}
          RELEASE_ARCHIVE: beanmap-${{ github.sha }}.tar.gz
        run: |
          set -euo pipefail
          source_path="${DEPLOY_SOURCE_PATH:-/srv/beanlog/app-src}"
          compose_path="${DEPLOY_COMPOSE_PATH:-/srv/beanlog/app}"
          for path_value in "$source_path" "$compose_path"; do
            case "$path_value" in
              /*) ;;
              *) echo "Deployment paths must be absolute." >&2; exit 1 ;;
            esac
            if [[ "$path_value" == *"'"* ]]; then
              echo "Deployment paths cannot contain a single quote." >&2
              exit 1
            fi
          done
          if [ ! -s "$RELEASE_ARCHIVE" ]; then
            echo "Release archive was not created." >&2
            exit 1
          fi
          remote_archive="/tmp/${RELEASE_ARCHIVE}"
          scp -i "$HOME/.ssh/beanmap_deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$RELEASE_ARCHIVE" "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive"
          ssh -i "$HOME/.ssh/beanmap_deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; source_path='$source_path'; compose_path='$compose_path'; archive='$remote_archive'; release_dir=\"\$(mktemp -d /tmp/beanmap-release.XXXXXX)\"; trap 'rm -rf \"\$release_dir\" \"\$archive\"' EXIT; tar -xzf \"\$archive\" -C \"\$release_dir\"; sudo mkdir -p \"\$source_path\"; sudo rsync -a --delete --exclude='.env*' --exclude='.audit-report.md' --exclude='CONTEXT.md' --exclude='.staging/' \"\$release_dir/\" \"\$source_path/\"; sudo docker compose --project-directory \"\$compose_path\" -f \"\$compose_path/docker-compose.yml\" up -d --build --remove-orphans --wait; sudo docker compose --project-directory \"\$compose_path\" -f \"\$compose_path/docker-compose.yml\" ps"
