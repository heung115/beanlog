name: beanmap CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beanmap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.18.0"
  GO_VERSION: "1.26.5"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    env:
      # Production build validation does not need real credentials. Runtime
      # credentials stay in the deployment environment.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: production
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for variable in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!variable:-}" ]; then
              echo "Deployment secret ${variable} is required when DEPLOY_ENABLED=true." >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/beanmap_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/beanmap_deploy" "$HOME/.ssh/known_hosts"

      - name: Stream verified source and rebuild the deployed services
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          # The server account has a forced command. It accepts only this
          # tar stream and cannot open a shell, tunnel, or arbitrary command.
          git archive --format=tar.gz HEAD | ssh -T -i "$HOME/.ssh/beanmap_deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o RequestTTY=no \
            "$DEPLOY_USER@$DEPLOY_HOST"
