name: beanmap CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beanmap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.18.0"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    env:
      # Production build validation does not need real credentials. Runtime
      # credentials stay in the deployment environment.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run quality gate
        run: npm run check

  deploy:
    name: Trigger production deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Notify production deployer
        shell: bash
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_WEBHOOK_SECRET:-}" ]; then
            echo "DEPLOY_WEBHOOK_SECRET is required." >&2
            exit 1
          fi

          payload="$(
            jq -cn \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg sha "$DEPLOY_SHA" \
              --argjson run_id "$GITHUB_RUN_ID" \
              '{repository: $repository, sha: $sha, run_id: $run_id}'
          )"
          signature="$(
            printf '%s' "$payload" \
              | python3 -c 'import hashlib, hmac, os, sys; print("sha256=" + hmac.new(os.environ["DEPLOY_WEBHOOK_SECRET"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())'
          )"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --header 'Content-Type: application/json' \
            --header "X-Hub-Signature-256: $signature" \
            --data-binary "$payload" \
            https://beanmap.site/_deploy/github
