name: ${STAGING_COMPOSE_PROJECT_NAME:-beanmap-staging}

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${STAGING_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${STAGING_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_APP_URL: ${STAGING_APP_URL:-http://localhost:3100}
      BEANMAP_THEME: ${BEANMAP_THEME:-mist}
      SUPABASE_SERVER_URL: ${STAGING_INTERNAL_SUPABASE_URL:-http://kong:8000}
      # Server Actions reach the Go API by its compose service name.
      GO_API_URL: ${STAGING_GO_API_URL:-http://api:8080}
      NEXT_DEPLOYMENT_ID: ${STAGING_DEPLOYMENT_ID:-beanmap-staging}
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./next.config.ts:/app/next.config.ts:ro
      - ./postcss.config.mjs:/app/postcss.config.mjs:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    ports:
      - "127.0.0.1:${STAGING_WEB_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/ko/login"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1001,gid=1001,mode=1777
      - /app/.next:rw,noexec,nosuid,nodev,size=2g,uid=1001,gid=1001,mode=0700
    pids_limit: 300
    # Turbopack's route graph cache approaches 1 GiB after a full desktop/mobile
    # audit, so leave headroom for later hot reloads in the same QA session.
    mem_limit: 3g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - staging-gateway

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      GIN_MODE: release
      DATABASE_URL_FILE: /run/secrets/api_database_url
      JWKS_URL: ${STAGING_JWKS_URL:-http://kong:8000/auth/v1/.well-known/jwks.json}
      JWT_ISSUER: ${STAGING_JWT_ISSUER:-http://127.0.0.1:55321/auth/v1}
      CORS_ORIGIN: ${STAGING_APP_URL:-http://localhost:3100}
    secrets:
      - api_database_url
    ports:
      - "127.0.0.1:${STAGING_API_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=1001,gid=1001,mode=1777
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - staging-gateway
      - staging-database

networks:
  staging-gateway:
    external: true
    name: ${STAGING_GATEWAY_NETWORK:-beanmap-staging-gateway}
  staging-database:
    external: true
    name: ${STAGING_DATABASE_NETWORK:-beanmap-staging-database}

secrets:
  api_database_url:
    file: ${STAGING_DATABASE_URL_FILE:?run npm run staging:up}
