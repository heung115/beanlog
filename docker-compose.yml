services:
  beanmap:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    environment:
      # Server-side only: Docker container → host Supabase
      SUPABASE_SERVER_URL: http://host.docker.internal:54321
      # Server Actions reach the Go API by its compose service name.
      GO_API_URL: ${GO_API_URL:-http://api:8080}
      # Runtime env for @supabase/ssr createServerClient (anon key is read from
      # process.env at runtime in the standalone/edge bundle, not only inlined).
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BEANMAP_THEME: ${BEANMAP_THEME:-mist}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  api:
    build:
      context: ./server
    env_file:
      - ./server/.env.docker
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
